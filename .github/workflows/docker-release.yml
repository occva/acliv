name: Docker Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-release.yml"
      - ".dockerignore"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "svelte.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - "public/**"
      - "src/**"
      - "src-tauri/web/**"
      - "src-tauri/src/paths.rs"
      - "src-tauri/src/session_manager/**"
      - "src-tauri/src/search_index/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version to backfill, for example 1.0.8 or v1.0.8"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.ref_type != 'tag'
    concurrency:
      group: docker-build-${{ inputs.version || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout requested tag
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          dockerfile="$(mktemp)"
          cp deploy/Dockerfile "$dockerfile"
          clean_version="${{ inputs.version }}"
          clean_version="${clean_version#v}"
          git fetch --depth=1 --force origin "refs/tags/v${clean_version}:refs/tags/v${clean_version}"
          git checkout "v${clean_version}"
          cp "$dockerfile" deploy/Dockerfile
          rm -f "$dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          image="ghcr.io/occva/acliv"
          manual_version="${{ inputs.version }}"
          if [[ -n "${manual_version}" ]]; then
            clean_version="${manual_version#v}"
            version="v${clean_version}"
            tags="${image}:${version},${image}:${clean_version},${image}:latest"
            image_tag="${clean_version}"
            build_ref="$(git rev-parse HEAD)"
          else
            short_sha="${GITHUB_SHA::7}"
            tags="${image}:latest,${image}:sha-${short_sha}"
            image_tag="sha-${short_sha}"
            build_ref="${GITHUB_SHA}"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "image_tag=${image_tag}"
            echo "build_ref=${build_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            ACLIV_IMAGE_TAG=${{ steps.prep.outputs.image_tag }}
            ACLIV_BUILD_REF=${{ steps.prep.outputs.build_ref }}
          cache-from: type=gha,scope=acliv-web
          cache-to: type=gha,mode=max,scope=acliv-web
          provenance: false

  release-tags:
    name: Publish Docker release tags
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docker-tags-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the master image
        shell: bash
        run: |
          set -euo pipefail
          source="ghcr.io/occva/acliv:sha-${GITHUB_SHA::7}"
          for _ in {1..120}; do
            docker buildx imagetools inspect "$source" >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "Master image was not published for ${GITHUB_SHA}: ${source}" >&2
          exit 1

      - name: Publish version metadata layer
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/occva/acliv"
          source="${image}:sha-${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME#v}"
          cat > /tmp/Dockerfile.release-metadata <<EOF
          FROM ${source}
          ENV ACLIV_IMAGE_TAG=${version}
          EOF
          docker buildx build \
            --file /tmp/Dockerfile.release-metadata \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            /tmp
