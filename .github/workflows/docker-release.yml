name: Docker Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-release.yml"
      - ".dockerignore"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "svelte.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - "public/**"
      - "src/**"
      - "src-tauri/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version to backfill, for example 1.0.8 or v1.0.8"
        required: false
        type: string

permissions:
  contents: read
  packages: write


jobs:
  docker:
    if: github.ref_type != 'tag'
    concurrency:
      group: docker-build-${{ inputs.version || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout requested tag
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          clean_version="${{ inputs.version }}"
          clean_version="${clean_version#v}"
          git fetch --depth=1 --force origin "refs/tags/v${clean_version}:refs/tags/v${clean_version}"
          git checkout "v${clean_version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          image="ghcr.io/occva/acliv"
          manual_version="${{ inputs.version }}"
          if [[ -n "${manual_version}" ]]; then
            clean_version="${manual_version#v}"
            version="v${clean_version}"
            tags="${image}:${version},${image}:${clean_version},${image}:latest"
            image_tag="${clean_version}"
            build_ref="${GITHUB_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            clean_version="${version#v}"
            tags="${image}:${version},${image}:${clean_version},${image}:latest"
            image_tag="${clean_version}"
            build_ref="${GITHUB_SHA}"
          else
            short_sha="${GITHUB_SHA::7}"
            tags="${image}:latest,${image}:sha-${short_sha}"
            image_tag="sha-${short_sha}"
            build_ref="${GITHUB_SHA}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${build_ref}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            ACLIV_IMAGE_TAG=${{ steps.prep.outputs.image_tag }}
            ACLIV_BUILD_REF=${{ steps.prep.outputs.build_ref }}
          cache-from: type=gha,scope=acliv-web
          cache-to: type=gha,mode=max,scope=acliv-web
          provenance: false

  release-tags:
    name: Publish Docker release tags
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-tags-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the master image and cache
        id: release
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/occva/acliv"
          version="${GITHUB_REF_NAME#v}"
          source="${image}:sha-${GITHUB_SHA::7}"
          for _ in {1..240}; do
            if docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "Master image was not published for ${GITHUB_SHA}: ${source}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${GITHUB_REF_NAME},${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build version metadata and publish release tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            ACLIV_IMAGE_TAG=${{ steps.release.outputs.version }}
            ACLIV_BUILD_REF=${{ github.sha }}
          cache-from: type=gha,scope=acliv-web
          provenance: false
