name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.18"
        required: true
        type: string
      publish:
        description: "Publish or replace GitHub Release assets"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  dispatch-release:
    name: Dispatch cached release build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch from master
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f "tag=$GITHUB_REF_NAME" -f "publish=true"

  verify-ci:
    name: Verify master CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate release tag and wait for CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Expected tag like v1.2.3, got: $RELEASE_TAG" >&2
            exit 1
          fi
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          run_id=""
          for _ in {1..60}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$release_sha" \
              --event push \
              --limit 10 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch == "master")][0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No master CI run found for $release_sha" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

  windows-release:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows
          save-if: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefer-offline --no-audit

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $tag = "${env:RELEASE_TAG}"
          if (-not $tag.StartsWith('v')) {
            throw "Expected tag ref like v1.2.3, got: $tag"
          }
          $version = $tag.Substring(1)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts.'
          }

      - name: Build release artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -Version ${{ steps.version.outputs.version }} -AllowDirty

      - name: Validate release notes
        shell: pwsh
        run: ./scripts/assert-release-notes.ps1 -Path release/v${{ steps.version.outputs.version }}/release-notes-v${{ steps.version.outputs.version }}.md

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-release:
    name: macos-release (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-${{ matrix.arch }}
          save-if: true

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Derive and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ./scripts/assert-version.sh "$version"
          ./scripts/assert-release-notes.sh "docs/releases/v${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts." >&2
            exit 1
          fi

      - name: Build macOS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          release_dir="release/v${version}"
          mkdir -p "$release_dir"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          tar_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          if [[ -z "$dmg_path" || ! -f "$dmg_path" ]]; then
            echo "Missing macOS .dmg installer" >&2
            exit 1
          fi
          if [[ -z "$tar_path" || ! -f "$tar_path.sig" ]]; then
            echo "Missing macOS updater .tar.gz or .sig" >&2
            exit 1
          fi
          cp "$dmg_path" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.dmg"
          cp "$tar_path" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.tar.gz"
          cp "$tar_path.sig" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.tar.gz.sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-ci
      - windows-release
      - macos-release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    timeout-minutes: 10
    steps:
      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/v${{ steps.version.outputs.version }}
          merge-multiple: true

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ASSETS="release/v${VERSION}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          ls \
            "$ASSETS/acliv-v${VERSION}-x64-en-us.msi" \
            "$ASSETS/acliv-v${VERSION}-x64-en-us.msi.sig" \
            "$ASSETS/acliv-v${VERSION}-macos-x64.tar.gz" \
            "$ASSETS/acliv-v${VERSION}-macos-x64.tar.gz.sig" \
            "$ASSETS/acliv-v${VERSION}-macos-arm64.tar.gz" \
            "$ASSETS/acliv-v${VERSION}-macos-arm64.tar.gz.sig" >/dev/null
          WIN_SIG="$(tr -d '\r\n' < "$ASSETS/acliv-v${VERSION}-x64-en-us.msi.sig")"
          MAC_X64_SIG="$(tr -d '\r\n' < "$ASSETS/acliv-v${VERSION}-macos-x64.tar.gz.sig")"
          MAC_ARM64_SIG="$(tr -d '\r\n' < "$ASSETS/acliv-v${VERSION}-macos-arm64.tar.gz.sig")"
          cat > "$ASSETS/latest.json" <<JSON
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-x64-en-us.msi"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-macos-x64.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM64_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-macos-arm64.tar.gz"
              }
            }
          }
          JSON
          jq empty "$ASSETS/latest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body_path: release/v${{ steps.version.outputs.version }}/release-notes-v${{ steps.version.outputs.version }}.md
          files: |
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}.exe
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-setup.exe
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-en-us.msi
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-en-us.msi.sig
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.dmg
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.tar.gz
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.tar.gz.sig
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.dmg
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sig
            release/v${{ steps.version.outputs.version }}/latest.json
