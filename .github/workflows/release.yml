name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify master CI
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for CI on the release commit
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in {1..60}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 10 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch == "master")][0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "No master CI run found for $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

  windows-release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefer-offline --no-audit

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if (-not $tag.StartsWith('v')) {
            throw "Expected tag ref like v1.2.3, got: $tag"
          }
          $version = $tag.Substring(1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts.'
          }

      - name: Build release artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-release.ps1 -Version ${{ steps.version.outputs.version }} -AllowDirty

      - name: Validate release notes
        shell: pwsh
        run: ./scripts/assert-release-notes.ps1 -Path release/v${{ steps.version.outputs.version }}/release-notes-v${{ steps.version.outputs.version }}.md

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-release:
    name: macos-release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Derive release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Expected tag ref like v1.2.3, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Sync release version
        run: ./scripts/sync-version.sh ${{ steps.version.outputs.version }}

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required for updater artifacts." >&2
            exit 1
          fi

      - name: Build macOS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          release_dir="release/v${version}"
          mkdir -p "$release_dir"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          tar_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          if [[ -z "$dmg_path" || ! -f "$dmg_path" ]]; then
            echo "Missing macOS .dmg installer" >&2
            exit 1
          fi
          if [[ -z "$tar_path" || ! -f "$tar_path.sig" ]]; then
            echo "Missing macOS updater .tar.gz or .sig" >&2
            exit 1
          fi
          cp "$dmg_path" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.dmg"
          cp "$tar_path" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.tar.gz"
          cp "$tar_path.sig" "$release_dir/acliv-v${version}-macos-${{ matrix.arch }}.tar.gz.sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-ci
      - windows-release
      - macos-release
    runs-on: ubuntu-latest
    steps:
      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/v${{ steps.version.outputs.version }}
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body_path: release/v${{ steps.version.outputs.version }}/release-notes-v${{ steps.version.outputs.version }}.md
          files: |
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}.exe
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-setup.exe
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-en-us.msi
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-x64-en-us.msi.sig
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.dmg
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.tar.gz
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-x64.tar.gz.sig
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.dmg
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            release/v${{ steps.version.outputs.version }}/acliv-v${{ steps.version.outputs.version }}-macos-arm64.tar.gz.sig

  latest-json:
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --dir assets --repo "${GITHUB_REPOSITORY}"
          ls -la assets

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          ls \
            "assets/acliv-v${VERSION}-x64-en-us.msi" \
            "assets/acliv-v${VERSION}-x64-en-us.msi.sig" \
            "assets/acliv-v${VERSION}-macos-x64.tar.gz" \
            "assets/acliv-v${VERSION}-macos-x64.tar.gz.sig" \
            "assets/acliv-v${VERSION}-macos-arm64.tar.gz" \
            "assets/acliv-v${VERSION}-macos-arm64.tar.gz.sig" >/dev/null
          WIN_SIG="$(tr -d '\r\n' < "assets/acliv-v${VERSION}-x64-en-us.msi.sig")"
          MAC_X64_SIG="$(tr -d '\r\n' < "assets/acliv-v${VERSION}-macos-x64.tar.gz.sig")"
          MAC_ARM64_SIG="$(tr -d '\r\n' < "assets/acliv-v${VERSION}-macos-arm64.tar.gz.sig")"
          cat > latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-x64-en-us.msi"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-macos-x64.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM64_SIG}",
                "url": "${BASE_URL}/acliv-v${VERSION}-macos-arm64.tar.gz"
              }
            }
          }
          JSON
          jq empty latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"
