name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect required checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout for change detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect required checks
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'package.json'
              - 'package-lock.json'
              - 'index.html'
              - 'svelte.config.js'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'public/**'
              - 'src/**'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
            desktop:
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/build.rs'
              - 'src-tauri/tauri.conf.json'
              - 'src-tauri/capabilities/**'
              - 'src-tauri/gen/**'
              - 'src-tauri/src/**'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
            web:
              - 'scripts/**'
              - 'src-tauri/web/**'
              - 'src-tauri/src/paths.rs'
              - 'src-tauri/src/session_manager/**'
              - 'src-tauri/src/search_index/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Svelte diagnostics
        run: npx svelte-check

      - name: Build frontend
        run: npm run build

  rust-desktop:
    name: Desktop Rust checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-desktop
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Check desktop
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Test desktop
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  rust-web:
    name: Web Rust checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/web -> target
          shared-key: ci-web
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Check web server
        run: cargo check --locked --manifest-path src-tauri/web/Cargo.toml

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - frontend
      - rust-desktop
      - rust-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
      DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
      WEB_REQUIRED: ${{ needs.changes.outputs.web }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DESKTOP_RESULT: ${{ needs.rust-desktop.result }}
      WEB_RESULT: ${{ needs.rust-web.result }}
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          for check in \
            "$FRONTEND_REQUIRED:$FRONTEND_RESULT:frontend" \
            "$DESKTOP_REQUIRED:$DESKTOP_RESULT:desktop" \
            "$WEB_REQUIRED:$WEB_RESULT:web"; do
            IFS=: read -r required result name <<< "$check"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "Required $name job did not succeed: $result" >&2
              exit 1
            fi
          done
          echo "CI gate passed (frontend=$FRONTEND_REQUIRED, desktop=$DESKTOP_REQUIRED, web=$WEB_REQUIRED)."
